<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twenny</title>
<meta name="description" content="Say a GPS fix, see it on the map.">
<meta name="theme-color" content="#EAEEEC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Twenny">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Apply a forced theme before first paint (stored as JSON by js/app.js).
  try { var t = JSON.parse(localStorage.getItem('twenny.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="wrap">
  <header>
    <div class="head-top">
      <h1>Twenny</h1>
      <button class="link-btn" id="locBtn" type="button">Use my location</button>
    </div>
    <span class="pills" id="locPills"><span class="pill" id="locName">Location off<span class="status" id="locDot" hidden></span></span><span class="pill-tail" id="locText" hidden></span></span>
  </header>

  <section class="cond" aria-labelledby="heardLbl">
    <div class="card-top">
      <label class="lbl" id="heardLbl" for="heard">Heard</label>
      <button class="btn small" id="clearBtn" type="button">Clear</button>
    </div>
    <textarea id="heard" rows="2" placeholder="Tap and talk, or type the fix" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></textarea>
    <p class="turn heard-status" id="parseStatus" aria-live="polite"><span class="status" id="parseDot" hidden></span><span id="parseText">Waiting for a fix</span></p>
    <p class="warn" id="fallbackNote" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span id="fallbackText"></span></p>
    <label class="check"><input type="checkbox" id="nwBox" checked> Assume N &amp; W when no direction is said</label>
  </section>

  <div class="map" id="map" role="region" aria-label="Map"></div>

  <section class="cond" id="fixCard" hidden aria-live="polite" aria-labelledby="fixLbl">
    <span class="lbl" id="fixLbl">Fix</span>
    <p class="stale" id="farWarn" hidden></p>
    <p class="val" id="whereLm"></p>
    <p class="turn" id="whereYou" hidden></p>
    <div class="trains fmts">
      <div class="train"><span class="ht" id="fDDM"></span><span class="tag">DDM</span></div>
      <div class="train"><span class="ht" id="fDMS"></span><span class="tag">DMS</span></div>
      <div class="train"><span class="ht" id="fDD"></span><span class="tag">DD</span></div>
    </div>
    <div class="srcs"><span class="pills" id="fixPills"></span></div>
    <div class="acts">
      <a class="btn" id="appleBtn" href="#" target="_blank" rel="noopener">Apple Maps</a>
      <a class="btn" id="googleBtn" href="#" target="_blank" rel="noopener">Google Maps</a>
      <button class="btn" id="copyBtn" type="button">Copy</button>
    </div>
  </section>

  <section class="fold-sec" id="recentSec" hidden aria-label="Recent fixes">
    <div class="chart-head" id="recentHead"><span>Recent fixes <span class="count" id="recentCount"></span></span><button
      type="button" class="calc-toggle" id="recentToggle" aria-controls="recentBody" aria-expanded="false"
      aria-label="Recent fixes"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 10 8 5.5 12.5 10"/></svg></button></div>
    <div class="fold-body" id="recentBody" hidden>
      <div class="rows" id="recentList"></div>
      <button class="btn small" id="recentClear" type="button">Clear recent fixes</button>
    </div>
  </section>

  <nav class="links" aria-label="Settings">
    <label class="theme">Theme <select id="themeSel">
      <option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option>
    </select></label>
    <span>Version <span id="ver">not saved yet</span></span>
    <button class="link-btn vlog-btn" id="vlogBtn" type="button">Voice log</button>
    <span class="links-note">Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.
      Landmark positions are approximate.</span>
  </nav>
  <section class="vlog-box" id="vlogBox" hidden aria-label="Voice log">
    <pre class="vlog" id="vlog"></pre>
    <button class="btn small" id="vlogCopy" type="button">Copy log</button>
  </section>
</main>

<div class="dock">
  <div class="tabs dock-track"><button class="talk" id="talk" type="button" aria-pressed="false">Tap and talk</button></div>
</div>

<p class="toast" id="toast" role="status" hidden></p>
<button class="toast update" id="updateBtn" type="button" hidden>New version, tap to refresh</button>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
